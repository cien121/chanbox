name: Build ChanBox APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout chanbox assets
        uses: actions/checkout@v4
        with:
          path: chanbox-assets

      - name: Checkout NekoBox source
        uses: actions/checkout@v4
        with:
          repository: MatsuriDayo/NekoBoxForAndroid
          ref: 5768494d8ae3c74a057bb6d46c0f8dc071b0d821
          path: nekobox

      - name: Customize branding and theme
        working-directory: nekobox
        run: |
          sed -i 's|<string name="app_name" translatable="false">NekoBox</string>|<string name="app_name" translatable="false">ChanBox</string>|' app/src/main/res/values/strings.xml
          sed -i 's|^PACKAGE_NAME=.*|PACKAGE_NAME=com.chan.box|' nb4a.properties
          sed -i 's/#E91E63/#2196F3/g' app/src/main/res/values/colors.xml
          sed -i 's/#C2185B/#1976D2/g' app/src/main/res/values/colors.xml
          sed -i 's/#F8BBD0/#BBDEFB/g' app/src/main/res/values/colors.xml
          sed -i 's/#F06292/#64B5F6/g' app/src/main/res/values/colors.xml

      - name: Integrate Xray bridge (Go)
        working-directory: nekobox
        run: bash ../chanbox-assets/bridge/integrate.sh

      - name: Install custom icons
        run: |
          cat chanbox-assets/icons/icons_part_*.b64 | base64 -d | tar xzf - -C nekobox/app/src/main/res

      - name: Install Golang
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25

      - name: Build libcore (sing-box core)
        working-directory: nekobox
        run: ./run lib core

      - name: Prepare signing keystore
        working-directory: nekobox
        run: base64 -d ../chanbox-assets/keystore.b64 > release.keystore

      - name: Gradle build APK
        working-directory: nekobox
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          ./run init action gradle
          ./gradlew app:assemblePreviewRelease
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk' | head -1)
          echo "APKDIR=$(dirname $APK)" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChanBox-APK
          path: nekobox/${{ env.APKDIR }}
